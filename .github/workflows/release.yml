# Publishes the package to npm whenever a version tag (v1.2.3) is pushed.
#
# Release flow:
#   npm run release      # bump version, update CHANGELOG, commit, tag, push
#
# Authentication uses npm trusted publishing (OIDC): no npm token or secret.
# The trusted publisher must be configured on npmjs.com for this repository,
# workflow file "release.yml" and environment "npm". See .github/RELEASING.md.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v1.0.9'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run cov:check

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # No dependency cache in the release job, as npm recommends.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Ensure npm supports trusted publishing
        run: |
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm -v)"; then
            npm install -g npm@11
          fi
          npm -v

      - name: Check tag matches package.json version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "base32-key@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::base32-key@$VERSION is already on npm, skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      - run: npm run build

      # Authenticates with OIDC; provenance is generated automatically.
      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        run: npm publish --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          # Use this version's section of CHANGELOG.md as the release notes.
          awk -v v="$VERSION" '
            /^##+ \[?[0-9]+\.[0-9]+\.[0-9]+/ { if (found) exit; if (index($0, "[" v "]") || index($0, " " v " ")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ] && grep -q '[^[:space:]]' notes.md; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi

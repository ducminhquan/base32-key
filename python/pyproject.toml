[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "base32-key"
version = "1.2.1"
description = "Human-friendly Base32 keys with a check digit per group"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["base32", "key", "license-key", "voucher", "checksum"]
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.scripts]
base32-key = "base32_key.__main__:main_entry"

[project.urls]
Homepage = "https://github.com/ducminhquan/base32-key"
Source = "https://github.com/ducminhquan/base32-key/tree/master/python"
Changelog = "https://github.com/ducminhquan/base32-key/blob/master/python/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
